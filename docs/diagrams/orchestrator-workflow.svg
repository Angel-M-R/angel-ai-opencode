<svg viewBox="0 0 1416 416" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="orch-title orch-desc">
  <title id="orch-title">Orchestrator workflow</title>
  <desc id="orch-desc">Flowchart: a user prompt is triaged; trivial changes take the quick lane, everything else goes through the interview gate, is routed to Direct workers or the OpenSpec agents, and both routes close at the review gate.</desc>
  <defs>
    <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="0.9" fill="rgba(45,49,66,0.10)"/>
    </pattern>
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
  </defs>

  <rect width="100%" height="100%" fill="#f5f5f5"/>
  <rect width="100%" height="100%" fill="url(#dots)" opacity="0.55"/>

  <!-- Arrows (behind nodes) -->
  <line x1="160" y1="224" x2="192" y2="224" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
  <line x1="368" y1="224" x2="416" y2="224" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
  <line x1="280" y1="272" x2="280" y2="324" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
  <line x1="640" y1="224" x2="672" y2="224" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
  <path d="M760,176 L760,96 L888,96" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
  <path d="M760,272 L760,352 L888,352" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
  <path d="M1096,96 L1128,96 L1128,216" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
  <path d="M1096,352 L1128,352 L1128,232" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
  <line x1="1132" y1="224" x2="1160" y2="224" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>

  <!-- Merge dot -->
  <circle cx="1128" cy="224" r="4" fill="#2d3142"/>

  <!-- Arrow labels -->
  <rect x="376" y="218" width="32" height="12" rx="2" fill="#f5f5f5"/>
  <text x="392" y="227" fill="#4f5d75" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.12em">NO</text>

  <rect x="264" y="292" width="32" height="12" rx="2" fill="#f5f5f5"/>
  <text x="280" y="301" fill="#4f5d75" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.12em">YES</text>

  <rect x="732" y="130" width="56" height="12" rx="2" fill="#f5f5f5"/>
  <text x="760" y="139" fill="#4f5d75" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.12em">DIRECT</text>

  <rect x="724" y="306" width="72" height="12" rx="2" fill="#f5f5f5"/>
  <text x="760" y="315" fill="#4f5d75" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.12em">OPENSPEC</text>

  <!-- Start oval -->
  <rect x="32" y="200" width="128" height="48" rx="24" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
  <text x="96" y="228" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">User prompt</text>

  <!-- Diamond: Trivial? -->
  <polygon points="280,176 368,224 280,272 192,224" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
  <text x="280" y="222" fill="#2d3142" font-size="11" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">Trivial</text>
  <text x="280" y="236" fill="#2d3142" font-size="11" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">change?</text>

  <!-- End oval: Quick lane -->
  <rect x="168" y="324" width="224" height="56" rx="28" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
  <text x="280" y="348" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">Quick lane</text>
  <text x="280" y="366" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">inline change + quick check</text>

  <!-- Rectangle: Interview gate -->
  <rect x="416" y="196" width="224" height="56" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
  <text x="528" y="220" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">Interview gate</text>
  <text x="528" y="238" fill="#4f5d75" font-size="8.5" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">product + technical &#183; technical &#183; skip</text>

  <!-- Diamond: Route selection -->
  <polygon points="760,176 848,224 760,272 672,224" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
  <text x="760" y="222" fill="#2d3142" font-size="11" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">Route</text>
  <text x="760" y="236" fill="#2d3142" font-size="11" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">selection</text>

  <!-- Rectangle: Direct workers -->
  <rect x="888" y="68" width="208" height="56" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
  <text x="992" y="92" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">General workers</text>
  <text x="992" y="110" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">implementation + validation</text>

  <!-- Rectangle: OpenSpec agents -->
  <rect x="888" y="324" width="208" height="56" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
  <text x="992" y="348" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">OpenSpec agents</text>
  <text x="992" y="366" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">planner &#8594; implementer &#8594; verifier</text>

  <!-- End oval: Review gate -->
  <rect x="1160" y="196" width="224" height="56" rx="28" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
  <text x="1272" y="220" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">Review gate</text>
  <text x="1272" y="238" fill="#4f5d75" font-size="8.5" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">correctness &#183; security-risk &#183; simplicity</text>
</svg>
